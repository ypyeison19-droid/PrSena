<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Editar perfil | Empléate</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f8f5;
            color: #17251c;
            min-height: 100vh;
        }

        .navbar {
            height: 72px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,.07);
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
        }

        .logo span {
            color: #39a900;
        }

        .volver {
            text-decoration: none;
            color: #566159;
            font-weight: 600;
        }

        .contenedor {
            width: 90%;
            max-width: 800px;
            margin: auto;
            padding: 55px 0;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .encabezado h1 span {
            color: #39a900;
        }

        .encabezado p {
            color: #69756d;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(35,70,45,.10);
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .campo {
            margin-bottom: 22px;
        }

        .campo label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .campo input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d7e1da;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        .campo input:focus {
            border-color: #39a900;
            box-shadow: 0 0 0 3px rgba(57,169,0,.10);
        }

        .boton {
            width: 100%;
            border: none;
            background: #39a900;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .boton:hover {
            background: #2f8d00;
        }

        @media (max-width: 650px) {

            .fila {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }

            .encabezado h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Emplé<span>ate</span>
        </div>

        <a href="/usuarios1/" class="volver">
            ← Volver al perfil
        </a>

    </nav>


    <main class="contenedor">

        <section class="encabezado">

            <h1>
                Edita tu perfil
                <span>profesional</span>
            </h1>

            <p>
                Mantén actualizada tu información en Empléate.
            </p>

        </section>


        <section class="card">

            <form method="POST">

                {% csrf_token %}


                <div class="fila">

                    <div class="campo">

                        <label>
                            Nombre
                        </label>

                        {{ formulario.nombre }}

                    </div>


                    <div class="campo">

                        <label>
                            Apellido
                        </label>

                        {{ formulario.apellido }}

                    </div>

                </div>


                <div class="campo">

                    <label>
                        Correo electrónico
                    </label>

                    {{ formulario.correo }}

                </div>


                <div class="fila">

                    <div class="campo">

                        <label>
                            Teléfono
                        </label>

                        {{ formulario.telefono }}

                    </div>


                    <div class="campo">

                        <label>
                            Ciudad
                        </label>

                        {{ formulario.ciudad }}

                    </div>

                </div>


                <button type="submit" class="boton">

                    💾 Guardar cambios

                </button>

            </form>

        </section>

    </main>


</body>

</html>
